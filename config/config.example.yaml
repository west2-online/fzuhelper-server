server:
  private-key: | # PKCS#8
    -----BEGIN PRIVATE KEY-----
    {insert your private key here}
    -----END PRIVATE KEY-----
  version: '1.0'
  name: 'fzuhelper'
  log-level: 'INFO' # OPTIONS: TRACE, DEBUG, INFO(default), NOTICE, WARN, ERROR, FATAL

admin:
  secret: ''
  feishu:
    app-id: 'cli_xxx'
    app-secret: ''
    redirect-uri: 'https://fzuhelper.west2.online/api/v1/admin/auth/callback'
    allowed-return-urls:
      - 'http://localhost:5173/auth/callback'

mcp:
  name: fzuhelper-mcp
  version: '1.0.0'

ai:
  key: ''
  endpoint: 'https://api.openai.com/v1'

defaultUser:
  account: ''
  password: ''

url:
  bucket: ''
  operator: ''
  pass: ''
  token-timeout: 1800
  path: ''

snowflake:
  worker-id: 0
  datancenter-id: 0

mysql:
  addr: 127.0.0.1:3306
  database: fzu-helper
  username: fzu-helper
  password: fzu-helper
  charset: utf8mb4

oss:
  endpoint: ''
  accessKey-id: ''
  accessKey-secret: ''
  bucketname: ''
  main-directory: fzuhelper

upyuns:
  launch_screen:
    bucket: 'fzuhelper-assets'
    operator: ''
    password: ''
    token-secret: ''
    token-timeout: 0
    uss-domain: ''
    download-domain: ''
    path: '/pictures/'
  paper:
    bucket: 'fzuhelper-paper-cos'
    operator: ''
    password: ''
    token-secret: ''
    token-timeout: 60
    uss-domain: ''
    download-domain: ''
    path: '/__Unchecked_adjowe/'
  version:
    bucket: 'fzuhelper-filedown'
    operator: ''
    password: ''
    token-timeout: 1800
    path: '/statistic/'
  common:
    bucket: 'fzuhelper-filedown'
    operator: ''
    password: ''
    token-timeout: 1800
    path: '/statistic/html/'

umeng:
  android:
    app_key: ''
    app_master_secret: ''
  ios:
    app_key: ''
    app_master_secret: ''
  harmony:
    app_key: ''
    app_master_secret: ''

vendors:
  xiaomi_notice:
    score:
      channel_id: '155827'
      template_id: 'P12395'
    exam:
      channel_id: '155826'
      template_id: 'P12394'
    teaching:
      channel_id: '133203'
      template_id: 'P12325'
  huawei:
    channel_importance: ''  # 华为通道重要性，例如 NORMAL/LOW
    channel_category: ''    # 华为消息分类，需在华为后台申请自分类权益后配置，例如 SERVICE
  harmony:
    channel_category: 'SUBSCRIPTION'  # 鸿蒙消息分类，需在友盟/华为后台申请自分类后配置，例如 SERVICE
    # 这里的华为配置指的原本版本的卓易通fuu,而后面新增的鸿蒙配置则指鸿蒙福uu

friend:
  max-nums : 3  # 兜底默认值，优先读取数据库 friend_config 表中 config_key='max_num' 的记录

api-monitor:
  enabled: true
  window-seconds: 300
  check-interval-seconds: 30
  error-rate-threshold: 0.05
  min-requests: 100
  alert-cooldown-seconds: 600
  route-blacklist:
    - /ping
    - /health
    - /metrics
    - /favicon.ico

signed_location_api_url:
  endpoint: "http://127.0.0.1:8888/v1/location/get_signed_location_api_url" #示例
  enabled: true
  disable_msg: "Service is unavailable"

elasticsearch:
  addr: 127.0.0.1:9200
  host: 127.0.0.1

redis:
  addr: fzu-helper-redis:6379
  password: fzu-helper

jaeger:
  addr: 127.0.0.1:6831

otel:
  endpoint: 127.0.0.1:4317

kafka:
  address: 127.0.0.1:9092
  network: tcp
  user: fzuhelper
  password: fzuhelper-password

services:
  template:
    name: template
    load-balance: false
    addr:
      - 127.0.0.1:10001

  api:
